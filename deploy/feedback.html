<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Góp ý DocX</title><style>body{font-family:system-ui;margin:0;background:#0f172a;color:#e5e7eb}.box{max-width:720px;margin:40px auto;padding:24px}input,textarea,select,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #334155;background:#111827;color:#fff}button{background:#2563eb;border:0;font-weight:700;cursor:pointer}.ok{color:#22c55e}.err{color:#ef4444}a{color:#93c5fd}</style></head><body><main class="box"><h1>Góp ý / báo lỗi DocX</h1><p>Khách hàng gửi lỗi, nhu cầu, đề xuất. Susan sẽ dùng dữ liệu này để cải tiến mỗi ngày.</p><form id="f"><input name="name" placeholder="Tên khách hàng"><input name="contact" placeholder="SĐT/Zalo/Email"><select name="type"><option value="bug">Báo lỗi</option><option value="feature">Đề xuất tính năng</option><option value="ux">Khó sử dụng</option><option value="other">Khác</option></select><textarea name="message" rows="8" required placeholder="Mô tả chi tiết: đang làm gì, lỗi gì, mong muốn ra sao..."></textarea><button>Gửi góp ý</button></form><p id="s"></p><p><a href="/">← Quay lại DocX</a></p></main><script>document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const s=document.getElementById('s');s.textContent='Đang gửi...';s.className='';const data=Object.fromEntries(new FormData(e.target).entries());try{const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error(await r.text());s.textContent='Đã nhận góp ý. Cảm ơn anh/chị.';s.className='ok';e.target.reset()}catch(err){s.textContent='Gửi lỗi, vui lòng thử lại.';s.className='err'}}</script></body></html>
